[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth_diagrams"
version = "0.1.0"
description = "Local server for SmoothDiagrams: storage and model calls."
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.32",
	"sqlalchemy[asyncio]>=2.0.36",
	"aiosqlite>=0.20",
	"alembic>=1.14",
	"pydantic>=2.9",
	"pydantic-settings>=2.6",
	"claude-agent-sdk>=0.1",
	"onnxruntime>=1.32.0",
	"numpy>=2.5.5",
	"pillow>=13.0.0",
	"huggingface-hub>=2.4.0",
	"resvg-py>=0.5.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3",
	"pytest-asyncio>=0.24",
	"httpx>=0.27",
	"ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["smooth_diagrams*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.format]
indent-style = "tab"
